<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">CpuOverlay</title>
  <desc id="desc">让桌面性能，一眼可见。Windows 原生性能悬浮窗。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c31"/><stop offset="1" stop-color="#09101b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d5f66b"/><stop offset="1" stop-color="#4bd6c4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#a8c6e8" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <rect x="56" y="48" width="116" height="28" rx="14" fill="#253821"/>
    <circle cx="73" cy="62" r="4" fill="#d5f66b"/>
    <text x="87" y="67" font-size="12" fill="#d5f66b" font-weight="600" letter-spacing="1">WINDOWS 原生</text>
    <text x="52" y="148" font-size="64" fill="#f5f8ff" font-weight="700" letter-spacing="-2">CpuOverlay</text>
    <text x="56" y="202" font-size="29" fill="#edf3ff" font-weight="600">让桌面性能，一眼可见。</text>
    <text x="56" y="242" font-size="17" fill="#93a6c1">轻量悬浮 · 实时监控 · 自由定制</text>
    <path d="M56 283 H478" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(760 48)">
      <rect x="0" y="0" width="464" height="244" rx="18" fill="#111f32" stroke="#2b4058"/>
      <circle cx="23" cy="22" r="4" fill="#54708d"/><circle cx="39" cy="22" r="4" fill="#54708d"/><circle cx="55" cy="22" r="4" fill="#54708d"/>
      <text x="438" y="27" text-anchor="end" font-size="11" fill="#8ca4bc" letter-spacing="2">性能概览 · 示意</text>
      <path d="M0 43 H464" stroke="#263b51"/>
      <text x="24" y="85" font-size="12" fill="#93a6c1" letter-spacing="1">CPU</text>
      <text x="24" y="133" font-size="38" fill="#d5f66b" font-weight="600">12.3<tspan font-size="18"> %</tspan></text>
      <text x="260" y="85" font-size="12" fill="#93a6c1" letter-spacing="1">GPU</text>
      <text x="260" y="133" font-size="38" fill="#67daca" font-weight="600">18.0<tspan font-size="18"> %</tspan></text>
      <path d="M24 181 L53 181 L70 167 L89 184 L116 174 L141 174 L157 157 L181 174 L205 165" stroke="#d5f66b" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M260 181 L284 176 L305 184 L327 160 L350 176 L371 168 L395 179 L421 158 L440 168" stroke="#67daca" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <text x="24" y="218" font-size="12" fill="#93a6c1">CPU · 内存 · GPU · 帧率 · 外设电量</text>
    </g>
  </g>
</svg>
