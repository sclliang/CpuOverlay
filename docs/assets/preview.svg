<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">CpuOverlay 显示示意</title>
  <desc id="desc">深色桌面上的黄色透明性能悬浮文字，展示横向和纵向布局。所有数字均为示例。</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14263c"/><stop offset=".6" stop-color="#101b2a"/><stop offset="1" stop-color="#172d3c"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b6d3ef" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="580" rx="20" fill="url(#desktop)"/>
  <rect width="1280" height="580" rx="20" fill="url(#dots)"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="40" y="48" font-size="13" fill="#8aa0b9" letter-spacing="2">横向布局</text>
    <g font-size="19" fill="#ffeb33" font-weight="700" stroke="#080b11" stroke-width=".7" paint-order="stroke">
      <text x="40" y="96">处理器:12.3% | 频率:4.25GHz | 温度:55℃ | 功耗:42.1W | 内存:37.5% | 显卡:18.0%</text>
    </g>
    <path d="M40 134 H1240" stroke="#2b3e53"/>
    <text x="40" y="178" font-size="13" fill="#8aa0b9" letter-spacing="2">纵向布局</text>
    <g font-size="21" fill="#ffeb33" font-weight="700" stroke="#080b11" stroke-width=".7" paint-order="stroke">
      <text x="40" y="222">处理器:</text><text x="160" y="222">12.3%</text>
      <text x="40" y="258">频率:</text><text x="160" y="258">4.25GHz</text>
      <text x="40" y="294">温度:</text><text x="160" y="294">55℃</text>
      <text x="40" y="330">功耗:</text><text x="160" y="330">42.1W</text>
      <text x="40" y="366">显卡:</text><text x="160" y="366">18.0%</text>
      <text x="40" y="402">FPS:</text><text x="160" y="402">144</text>
      <text x="40" y="438">1% Low:</text><text x="160" y="438">112</text>
    </g>
    <g transform="translate(430 177)">
      <rect width="810" height="292" rx="14" fill="#101c2d" fill-opacity=".85" stroke="#304258"/>
      <text x="32" y="43" font-size="19" fill="#edf4ff" font-weight="600">按你的习惯，安排每一项。</text>
      <text x="32" y="80" font-size="15" fill="#91a7c1">独立开关显示项，调整顺序，统一数值对齐。</text>
      <g font-size="15" fill="#cbd9e9">
        <circle cx="39" cy="124" r="4" fill="#d5f66b"/><text x="56" y="129">字体、颜色、描边与透明度</text>
        <circle cx="39" cy="164" r="4" fill="#d5f66b"/><text x="56" y="169">多屏选择与拖动定位</text>
        <circle cx="39" cy="204" r="4" fill="#d5f66b"/><text x="56" y="209">15 项指标 · 200–5000 毫秒刷新</text>
      </g>
      <rect x="32" y="237" width="104" height="30" rx="6" fill="#26374a" stroke="#455b72"/>
      <text x="84" y="257" text-anchor="middle" font-size="13" fill="#f0f5fc">Alt + F1</text>
      <text x="151" y="257" font-size="13" fill="#91a7c1">随时显示 / 隐藏</text>
    </g>
    <path d="M40 508 H1240" stroke="#2b3e53"/>
    <text x="40" y="549" font-size="13" fill="#8aa0b9">透明背景 · 鼠标穿透 · 置顶显示</text>
    <text x="1240" y="549" text-anchor="end" font-size="12" fill="#8aa0b9">界面示意 / 示例数据</text>
  </g>
</svg>
